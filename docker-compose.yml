# Ambiente de desenvolvimento: docker compose up
# Para produção, veja docs/auto-hospedagem.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: batepapo
      POSTGRES_PASSWORD: batepapo
      POSTGRES_DB: batepapo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batepapo"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BATEPAPO_ENV: development
      BATEPAPO_DATABASE_URL: postgres://batepapo:batepapo@postgres:5432/batepapo?sslmode=disable
      BATEPAPO_SMS_PROVIDER: console
      # Devolve o código SMS na resposta da API. Apenas desenvolvimento!
      BATEPAPO_DEV_EXPOSE_OTP: "true"
    volumes:
      - blobs:/data
    ports:
      - "8080:8080"

volumes:
  pgdata:
  blobs:
